version: 2

models:

  - name: stg_carts
    description: "This staging model is designed to process and transform the raw cart data from the source system."
    columns:
      - name: cart_id
        description: "Unique identifier for each cart."
        data_test:
          - not_null
      - name: id
        description: "Unique identifier for each product in the cart."
        data_test:
          - not_null
      - name: title
        description: "Title of the product in the cart."
      - name: price
        description: "Price of the product in the cart."
      - name: quantity
        description: "Quantity of the product in the cart."
      - name: total
        description: "Total cost for the product in the cart (price * quantity)."
      - name: discounted_total
        description: "Total cost after applying any discounts."
      - name: discount_percentage
        description: "Percentage of discount applied to the product."
      - name: discounted_price
        description: "Price of the product after applying the discount."
      - name: userId
        description: "Identifier for the user associated with the cart."
      - name: ingestion_timestamp
        description: "Timestamp indicating when the data was ingested into the staging model."

        
  - name: stg_products
    description: "This staging model is designed to process and transform the raw product data from the the source system."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_test:
          - not_null
          - unique
      - name: title
        description: "Title of the product."
      - name: category
        description: "Category to which the product belongs."
      - name: price
        description: "Price of the product."
      - name: discountpercentage
        description: "Percentage of discount applied to the product."
      - name: stock
        description: "Number of items available in stock for the product."
      - name: brand
        description: "Brand associated with the product."
      - name: width
        description: "Width of the product."
      - name: height
        description: "Height of the product."
      - name: depth
        description: "Depth of the product."
      - name: shippinginformation
        description: "Information regarding the shipping options for the product."
      - name: availabilitystatus
        description: "Current availability status of the product (e.g., in stock, out of stock)."
      - name: rating
        description: "Rating given to the product by customers."
      - name: comment
        description: "Comment or review provided by customers for the product."
      - name: reviewdate
        description: "Date when the review was submitted."
      - name: reviewername
        description: "Name of the customer who submitted the review."
      - name: reviewemail
        description: "Email of the customer who submitted the review."
      - name: returnpolicy
        description: "Information regarding the return policy for the product."
      - name: minimumorderquantity
        description: "Minimum quantity required to place an order for the product."
      - name: thumbnail
        description: "URL or path to the thumbnail image of the product."
      - name: ingestion_timestamp
        description: "Timestamp indicating when the data was ingested into the staging model."

  - name: stg_customers
    description: "This staging model is designed to process and transform the raw customer data from the source system."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_test:
          - not_null
          - unique
      - name: firstname
        description: "First name of the customer."
      - name: lastname
        description: "Last name of the customer."
      - name: customername
        description: "customername chosen by the customer."
      - name: gender
        description: "Gender of the customer."
      - name: email
        description: "Email address of the customer."
      - name: dateofbirth
        description: "Date of birth of the customer."
      - name: city
        description: "City where the customer resides."
      - name: currency
        description: "Currency used by the customer for transactions."
      - name: cardtype
        description: "Type of card used by the customer for transactions."
      - name: department
        description: "Department associated with the customer."
      - name: customer_role
        description: "Role assigned to the customer (e.g., admin, customer)."
      - name: ingestion_timestamp
        description: "Timestamp indicating when the data was ingested into the staging model."

  - name: stg_recipes
    description: "This staging model is designed to process and transform the raw recipe data from the source system."
    columns:
      - name: recipe_id
        description: "Unique identifier for each recipe."
        data_test:
          - not_null
          - unique
      - name: recipe_name
        description: "Name of the recipe."
      - name: prep_time_minutes
        description: "Preparation time required for the recipe in minutes."
      - name: cook_time_minutes
        description: "Cooking time required for the recipe in minutes."
      - name: servings
        description: "Number of servings the recipe yields."
      - name: difficulty
        description: "Difficulty level of preparing the recipe (e.g., easy, medium, hard)."
      - name: cuisine
        description: "Type of cuisine the recipe belongs to (e.g., Italian, Chinese)."
      - name: calories_per_serving
        description: "Number of calories per serving of the recipe."
      - name: userId
        description: "ID of the customer who created the recipe."
      - name: rating
        description: "Rating given to the recipe by users."
      - name: review_count
        description: "Count of reviews submitted for the recipe."
      - name: ingestion_timestamp
        description: "Timestamp indicating when the data was ingested into the staging model."
